# Continuous integration.
#
# This is the repository's first CI configuration, and it exists for one
# concrete reason before any general one: `crates/krab-lock` contains the
# workspace's only `unsafe`, half of it is the Windows arm — `VirtualLock`,
# `VirtualUnlock`, `SetErrorMode`, `IsDebuggerPresent` — and **that half has
# never been executed**. It cross-compiles and it passes clippy for both
# Windows targets, which establishes that the declarations are well-formed and
# nothing more. `Documentation/UNSAFE-AUDIT.md` says so in as many words:
#
#   > What would close this: running `cargo test -p krab-lock` on Windows.
#   > That is one line in CI and it is the only thing that turns the arm from
#   > *compiled* into *working*.
#
# This is that line. Everything else here is ordinary hygiene.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # For `audit` and `fuzz`, which are about the world changing rather than the
  # code changing. An advisory published against a dependency makes this tree
  # vulnerable without anybody touching it, and a fuzzer finds more in an hour
  # than in the four minutes a push can justify.
  schedule:
    # 04:17 UTC daily. Not on the hour: GitHub queues scheduled runs and the
    # top of the hour is where everyone else's are.
    - cron: "17 4 * * *"

# A push that supersedes an in-flight run cancels it. CI that reports on stale
# commits is CI people learn to ignore.
#
# **The event name is in the group** so a push does not cancel a scheduled run.
# Without it, the nightly fuzz job shares a group with pushes to the same ref,
# and any commit during those thirty minutes kills it — which would present as
# a fuzz job that mysteriously never finishes on an active day, and never on a
# quiet one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a CI failure costs nothing and is the difference between
  # "a test failed" and knowing where.
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------
  # The reason this file exists.
  #
  # Separate from the full matrix below and deliberately narrow: it runs the
  # unsafe boundary's own tests on a real Windows kernel. If the full suite
  # turns out to have unrelated Windows problems, this job still answers the
  # question the audit asked, and it answers it first.
  # ---------------------------------------------------------------------
  windows-unsafe-boundary:
    name: krab-lock on Windows (the audit's open question)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain argument: `rust-toolchain.toml` pins 1.94.1 and rustup
      # honours it. Naming a version here would create a second place for the
      # toolchain to be specified, and they would disagree eventually.
      - name: Show toolchain
        run: rustup show
      # `--nocapture` is not decoration. Every test in this crate tolerates a
      # refusal — a container that cannot lock is a real machine — so a green
      # run does not by itself say *which* branch executed.
      # `report_what_this_platform_granted` prints it, and that print is the
      # artefact this job exists to produce.
      - name: Test the unsafe boundary
        run: cargo test -p krab-lock -- --nocapture

  # ---------------------------------------------------------------------
  # Everything else, on the three platforms the project targets.
  #
  # Windows is a first-class target here, not an afterthought — but its full
  # suite has never run either, so a failure in this job is information rather
  # than a regression until it has passed once.
  # ---------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: which platforms fail
      # is the whole content of a first run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Show toolchain
        run: rustup show
      - name: Test
        run: cargo test --workspace

  # There is deliberately **no `cargo fmt --check` gate**, and this is the
  # reason rather than an oversight.
  #
  # The tree is not currently rustfmt-clean: `cargo fmt --all --check` reports
  # 126 diffs across 28 files, and 25 of those files predate this workflow. A
  # gate added today would fail on its first run for reasons unrelated to any
  # change being tested, and a red check that everyone knows to ignore is worse
  # than no check — it trains people past the ones that matter, including the
  # Windows job above.
  #
  # Turning it on is a two-step job for whoever wants it: run `cargo fmt --all`
  # as its own commit touching nothing else, then add the gate in the commit
  # after. Doing it as a side effect of a feature branch would bury real
  # changes in a thousand lines of reflow.
  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        # `--all-features` matters: `socks` and `serial` are features, and a
        # lint that only ever sees the default set does not cover them.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Cross-compilation is what caught a Linux-only clippy warning in
  # `krab-lock::harden` that never appeared on the development Mac. It is
  # cheap and it covers the arms no runner executes.
  cross:
    name: cross-check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-gnu
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Check
        run: cargo clippy -p krab-lock -p krab-fabric --target ${{ matrix.target }} --all-targets -- -D warnings

  # The two shell suites. Bash only, so Linux and macOS — they drive real
  # nodes over real sockets and are the tests that have historically caught
  # what unit tests did not.
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Smoke
        run: ./smoke.sh
      - name: Three nodes
        run: ./smoke-three-nodes.sh

  # ---------------------------------------------------------------------
  # Known advisories against the dependency tree.
  #
  # **Vulnerabilities fail; warnings do not.** `cargo audit` exits non-zero on
  # a vulnerability and prints warnings — unmaintained, unsound, yanked —
  # without failing, and that split is kept deliberately. A vulnerability is a
  # defect in this tree whoever introduced it. "Unmaintained" is a judgement
  # about a maintainer's attention, and a build that goes red because somebody
  # stopped answering issues is the `cargo fmt` problem again: a check people
  # learn to click past, and they click past the Windows job on the way.
  #
  # The warnings are still printed, and they are still read. At the time this
  # job was added there were four: `paste` and `lru` (both via `ratatui`, and
  # `lru`'s two unsoundness advisories are in an LRU cache the interface does
  # not reach with a panicking `Drop`), and a **yanked `chacha20 0.10.1` under
  # `chacha20poly1305`, which is the cipher every sealed object uses**. That
  # last one was worth acting on and was: pinned forward to 0.10.2 in the same
  # commit. Finding it is the argument for this job — nothing else in CI reads
  # the advisory database, and the crate had been yanked for some time.
  #
  # Installed with `cargo install` rather than a marketplace action. A
  # third-party action in the job that checks the supply chain is a
  # supply-chain step inside the supply-chain check, and `--locked` means this
  # builds the versions cargo-audit's own authors tested.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keyed on the tool version, not on the lockfile: the binary does not
      # change when this repository's dependencies do.
      - name: Cache cargo-audit
        id: audit-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-v0.22.2-${{ runner.os }}
      - name: Install cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2
      # The workspace lockfile — what the shipped binary is built from.
      - name: Audit the workspace
        run: cargo audit
      # And the fuzz crate's, which is separate because `fuzz` is excluded from
      # the workspace. It ships nothing, so this is reported and does not fail
      # the build: a vulnerability in `libfuzzer-sys` is worth knowing about
      # and is not a vulnerability in Krab.
      - name: Audit the fuzz crate
        continue-on-error: true
        run: cargo audit --file fuzz/Cargo.lock

  # ---------------------------------------------------------------------
  # Fuzzing, on the schedule rather than on every push.
  #
  # # On "run it for hours"
  #
  # A GitHub-hosted job is capped at **six hours** and cannot be raised. So
  # "hours" is available and "indefinitely" is not, and the cap is not the
  # binding constraint anyway — thirty minutes a target, nightly, accumulates
  # more than one long run does, because the corpus carries forward.
  #
  # That is what the cache below is for. `fuzz/corpus/` is gitignored, so
  # without it every run would start from `fuzz/seeds/` and re-discover the
  # same inputs — and the measurement in `fuzz/README.md` is exactly how much
  # that costs: 972 covered blocks from an empty corpus against 3 373 from a
  # seeded one, on the same target. A fuzzer that forgets is a fuzzer that
  # spends its budget on ground it has already covered.
  #
  # `timeout-minutes` is set explicitly and above the sum of the per-target
  # budgets, so a hang in one target is killed by libFuzzer's own `-timeout`
  # and a hang in the *job* is killed here rather than burning to the six-hour
  # cap.
  fuzz:
    name: fuzz ${{ matrix.target }}
    # Not on pushes: a fuzz run that must finish before a merge is a fuzz run
    # too short to find anything, and it would make every push wait on it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [picture, control, object, ingest, cbor]
    steps:
      - uses: actions/checkout@v4
      # `cargo fuzz` needs nightly, and `rust-toolchain.toml` pins 1.94.1 for
      # everything else. This is the one job that deliberately steps outside
      # that pin, and it ships nothing.
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal
      - name: Cache cargo-fuzz
        id: fuzz-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}
      - name: Install cargo-fuzz
        if: steps.fuzz-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --locked
      # Carried between runs, so each night starts where the last one stopped.
      # `restore-keys` means a run still starts from the most recent corpus
      # when the exact key misses, which it does every time the seeds change.
      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # 30 minutes per target. `-timeout=25` makes a single input that hangs a
      # finding rather than a lost run — the picture target decodes and
      # re-encodes, so a decompression bomb is a plausible input rather than a
      # hypothetical one.
      - name: Fuzz
        run: |
          SEEDS=fuzz/seeds/${{ matrix.target }}
          test -d "$SEEDS" || SEEDS=""
          cargo +nightly fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} $SEEDS \
            -- -max_total_time=1800 -timeout=25 -rss_limit_mb=4096
      # A crash is written to `fuzz/artifacts/` and is the entire point of the
      # run. Uploaded on failure so it survives the runner, because a crashing
      # input nobody kept is a crash nobody can reproduce.
      - name: Upload crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

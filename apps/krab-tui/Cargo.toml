[package]
name = "krab-tui"
description = "Krab TUI application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The crate is `krab-tui` per RFC 0 §4.3, but the binary operators invoke is
# `krab`. The library facade owns the `krab` crate name, so the two coexist.
[[bin]]
name = "krab"
path = "src/main.rs"

[dependencies]
# Column width for the output pane. ratatui already wraps by display
# width; when this crate took over that wrapping it had to as well, or a
# double-width character overflows a row that "fits" by character count.
unicode-width = "0.2"
krab = { workspace = true }
krab-core = { workspace = true }
krab-crypto = { workspace = true }
krab-fabric = { workspace = true }
krab-lock = { workspace = true }
krab-node = { workspace = true }
krab-proto = { workspace = true }
krab-store = { workspace = true }
# The OS entropy source. `krab-crypto` takes randomness as an argument and has
# no platform dependency, so this is the one place in the workspace that names
# an operating system as the root of key material.
getrandom = "0.2"
# RFC 8 §6's picture pipeline. Pure Rust, and pinned exactly like everything
# else in this tree — see `Documentation/REPRODUCIBLE-BUILDS.md`.
#
# **These are the attack surface.** RFC 8 §6 says so in as many words: image
# parsers are historically the richest source of remote code execution, which
# is why nothing here validates and everything is re-encoded. Two decoders is
# two parsers; the alternative is a format nobody can send.
png = "=0.18.1"
zune-jpeg = "=0.5.15"
# For the CRC in `picture`'s bomb fixtures. Already in the tree via `png`.
crc32fast = "=1.5.0"
# Memory hygiene, not cryptography. `krab-crypto`'s single-boundary rule is
# about the primitives an auditor must review; `zeroize` is a volatile-write
# helper already in the tree transitively, and a hand-rolled loop under this
# crate's `forbid(unsafe_code)` is one the optimiser is free to delete.
zeroize = "1"
ratatui = "0.29"
crossterm = "0.28"

[package]
name = "krab-fabric"
description = "Krab transport abstraction and backends: tcp, socks(tor), serial, courier, sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# RFC 4 §4.1's Noise IK.
#
# **This crate is the workspace's second cryptographic boundary**, and that is a
# deliberate change from the single boundary `krab-crypto` originally claimed.
# `snow` resolves the older major versions of curve25519-dalek,
# chacha20poly1305 and sha2 than `hpke` requires, and no combination satisfies
# both — so a binary linking Noise and HPKE contains two of each primitive.
#
# The boundary is therefore restated rather than pretended away:
#
#   krab-crypto  — object-layer crypto. What protects messages.
#   krab-fabric  — link-layer crypto.   What protects transports.
#
# Two audits, both named. They are genuinely different trust domains — a link
# compromise exposes traffic analysis, an object compromise exposes content —
# and both duplicated implementations are dalek, differing by major version
# rather than by author. Recorded in `Documentation/CRYPTO-BOUNDARIES.md`.
[dependencies]
# Constant-time comparison for the static-key check. `snow` already links it.
subtle = { version = "2", default-features = false }

# RFC 4 §5.3's serial carrier: a direct cable, a wired radio modem, or an X.25
# PAD. `default-features = false` drops `libudev`, which is a C dependency --
# RFC 4 §5.5 rejected ZMQ partly for having one. What that costs is port
# *enumeration*, not port *opening*, and the operator names the device anyway
# (Documentation/NO-CONFIG.md).
serialport = { version = "4", default-features = false, optional = true }
# `std` is deliberately absent. snow's `std` feature lists `ring/std` rather
# than `ring?/std`, so enabling it activates `ring` -- a C dependency, and
# RFC 4 §5.5 rejected ZMQ partly for having one. It also does not
# cross-compile without a target C toolchain, which would have made Windows
# and Linux builds depend on the host.
#
# Dropping it removes `ring` entirely and costs nothing this crate uses.
# `cargo tree -p krab-fabric | grep ring` is the check.
snow = { version = "0.10", default-features = false, features = [
    "default-resolver",
    "use-curve25519",
    "use-chacha20poly1305",
    "use-sha2",
    # Noise draws its ephemeral internally, so entropy is not injectable here
    # the way it is in `krab-crypto`. See `backend::tcp`'s note.
    "use-getrandom",
] }
krab-core = { workspace = true }
krab-proto = { workspace = true }

[features]
default = ["tcp", "courier", "sim", "serial", "socks"]
tcp = []
socks = ["tcp"]
serial = ["dep:serialport"]
courier = []
sim = []

[workspace]
# `fuzz` is built by `cargo fuzz` under nightly with sanitiser flags, and the
# workspace release profile sets `panic = "abort"` per RFC 7 §9 -- which would
# hide the panics fuzzing exists to find.
exclude = ["fuzz"]
resolver = "2"
members = [
    "crates/krab-core",
    "crates/krab-crypto",
    "crates/krab-store",
    "crates/krab-proto",
    "crates/krab-lock",
    "crates/krab-fabric",
    "crates/krab-picture",
    "crates/krab-node",
    "crates/krab",
    "apps/krab-tui",
    "apps/krab-sim",
    "apps/krab-sizes",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Matches `rust-toolchain.toml`, and deliberately.
#
# An MSRV below the pinned toolchain is a claim nobody checks: this workspace
# is built with 1.94.1 for reproducibility (RFC 0 §9), nothing is ever compiled
# with 1.75, and a reader taking that number at face value gets a failure that
# names a missing feature rather than a wrong toolchain. Declaring the version
# actually used is the only honest figure available.
rust-version = "1.94.1"
license = "MIT"
repository = "https://github.com/vulogov/krab"
authors = ["Vladimir Ulogov"]

[workspace.dependencies]
krab-core = { path = "crates/krab-core" }
krab-crypto = { path = "crates/krab-crypto" }
krab-store = { path = "crates/krab-store" }
krab-proto = { path = "crates/krab-proto" }
krab-lock = { path = "crates/krab-lock" }
krab-fabric = { path = "crates/krab-fabric" }
krab-picture = { path = "crates/krab-picture" }
krab-node = { path = "crates/krab-node" }
krab = { path = "crates/krab" }

[profile.release]
opt-level = 3
lto = true
# RFC 0 §4.3 / RFC 7 §9. **Not a core-dump control** — this comment used to
# say it was, and had it backwards: abort raises SIGABRT, whose default
# disposition is to write a core file, while unwinding writes none. What
# suppresses dumps is `RLIMIT_CORE`/`PR_SET_DUMPABLE`, applied by
# `krab_lock::harden` at the first statement of `main`.
#
# It stays for the reason it is actually worth having: a panic must not unwind
# through a partially-zeroized structure, running `Drop` on key material in an
# unknown state.
panic = "abort"
# **Arithmetic behaves the same in the shipped binary as under test.**
#
# Without this, `debug` panics on overflow and `release` wraps — so every
# `never_panics_on_arbitrary_input` test in this tree was exercising semantics
# the shipped binary does not have, and a wrap found by fuzzing would have been
# a panic in the test and a silently wrong number in production. The numbers
# that would wrap are expiries and sizes: an expiry that wraps is an object
# stored for ever, and RFC 0 §6 makes that silent.
#
# The cost is stated rather than waved at: with `panic = "abort"` above, an
# overflow is an abort, so this converts a silently wrong result into a
# terminated node. That is the right direction for this program — the code
# already prefers loud failure everywhere else, and the arithmetic on
# attacker-controlled values is deliberately `saturating_*` so a reachable
# overflow is a bug rather than an input.
overflow-checks = true
# Reproducible builds are `build-reproducible.sh`, not a profile key.
#
# Cargo's own `trim-paths` would be the right mechanism and is not stable in
# 1.94.1 — it needs nightly, and RFC 0 §9's whole argument is that a user must
# be able to verify the binary without trusting the author, which a nightly
# requirement makes harder rather than easier.
#
# So the remapping is applied by the build script, which computes the prefixes
# from the checkout rather than hard-coding them. A `--remap-path-prefix` in
# `.cargo/config.toml` cannot do that: it would have to name *this* machine's
# directory and would silently do nothing on anyone else's.
